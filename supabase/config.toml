# Supabase local development configuration for Voygo.
project_id = "voygo"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# Email sign-in sends a one-time code (typed into the Android app) plus a link (web).
# The hosted project needs the same templates pasted into Auth → Email Templates.
[auth.email]
enable_signup = true
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Voygo sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Welcome to Voygo — your code"
content_path = "./supabase/templates/confirmation.html"

# Phone OTP via Twilio (configure secrets with `supabase secrets set`).
[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGING_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_OAUTH_CLIENT_ID)"
secret = "env(APPLE_OAUTH_SECRET)"

[functions.notify]
verify_jwt = false

[functions.expire-offers]
verify_jwt = false

[functions.dispatch-scheduled]
verify_jwt = false
