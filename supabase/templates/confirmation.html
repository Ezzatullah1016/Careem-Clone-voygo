<!--
  Supabase Auth → Email Templates → "Confirm signup" (first sign-in with a new email).
  Subject: Welcome to Voygo — your code
  {{ .Token }} is the one-time code typed into the app; {{ .ConfirmationURL }} confirms on the web.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fa;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:24px;padding:32px;">
        <tr>
          <td style="font-size:28px;font-weight:800;color:#191c1d;letter-spacing:-0.5px;">
            Voygo<span style="color:#00c853;">&#8226;</span>
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px;font-size:16px;line-height:24px;color:#3c4a3c;">
            Welcome aboard. Your code to finish signing up:
          </td>
        </tr>
        <tr>
          <td style="padding:16px 0;font-size:36px;font-weight:700;letter-spacing:10px;color:#191c1d;">
            {{ .Token }}
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:20px;color:#3c4a3c;">
            Enter it in the Voygo app. It expires shortly and works once.
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px;font-size:14px;line-height:20px;color:#3c4a3c;">
            On a computer? You can also
            <a href="{{ .ConfirmationURL }}" style="color:#006e2a;font-weight:600;">confirm with this link</a>.
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px;font-size:12px;line-height:18px;color:#6b7280;">
            Didn't sign up for Voygo? Ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
